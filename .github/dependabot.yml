version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      graphql:
        patterns:
          [
            '@apollo/*',
            '@as-integrations/*',
            'graphql',
            'graphql-*',
            'dataloader',
          ]
      # vitest and its coverage package must move together, majors included:
      # a version mismatch between them fails `npm ci` before any test runs.
      vitest:
        patterns: ['vitest', '@vitest/*']
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Prisma 8 is a different CLI (no `migrate`/`generate`); upgrade deliberately.
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
      # Apollo Server 5 supports graphql 16 only.
      - dependency-name: graphql
        update-types: ['version-update:semver-major']
      # TypeScript 7 is a rewrite the Nest CLI build does not handle yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node typings must track the runtime in .nvmrc and the Dockerfile,
      # or code compiles against APIs the deployed Node does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
